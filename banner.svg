<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0716"/>
      <stop offset="0.55" stop-color="#150A2E"/>
      <stop offset="1" stop-color="#1E1137"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#D946EF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .star { animation: twinkle 4s ease-in-out infinite; }
  </style>

  <rect width="1200" height="240" fill="url(#bgGrad)"/>
  <rect width="1200" height="240" fill="url(#glow1)"/>
  <rect width="1200" height="240" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#titleGrad)"/>

  <!-- starfield (dreamer motif) -->
  <g fill="#C4B5FD">
    <circle class="star" cx="150" cy="40" r="2" style="animation-delay:0s"/>
    <circle class="star" cx="420" cy="28" r="1.6" style="animation-delay:1.1s"/>
    <circle class="star" cx="700" cy="45" r="2.2" style="animation-delay:2.3s"/>
    <circle class="star" cx="980" cy="30" r="1.6" style="animation-delay:0.6s"/>
    <circle class="star" cx="1100" cy="60" r="2" style="animation-delay:1.8s"/>
    <circle class="star" cx="260" cy="70" r="1.4" style="animation-delay:3.1s"/>
    <circle class="star" cx="560" cy="52" r="1.8" style="animation-delay:2.7s"/>
    <circle class="star" cx="860" cy="70" r="1.5" style="animation-delay:0.9s"/>
  </g>

  <!-- journey path -->
  <path d="M120 190 L1080 190" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="10 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="144" to="0" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- nodes -->
  <g>
    <circle cx="320" cy="190" r="6" fill="#A78BFA">
      <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="190" r="6" fill="#D946EF">
      <animate attributeName="r" values="6;9;6" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="190" r="6" fill="#F0ABFC">
      <animate attributeName="r" values="6;9;6" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="320" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#C4B5FD">land surveyor</text>
  <text x="600" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#C4B5FD">dreamer</text>
  <text x="880" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#C4B5FD">builder</text>

  <text x="80" y="72" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="url(#titleGrad)">Tema — aka TrothByte</text>
  <text x="80" y="108" font-family="system-ui, sans-serif" font-size="22" fill="#C4B5FD">Measuring the earth → mapping the machine</text>
  <text x="80" y="228" font-family="system-ui, sans-serif" font-size="14" fill="#6D6F8A">AI is the new basic skill · building github.com/TrothByte/low-level-skills-trothbyte</text>
</svg>
